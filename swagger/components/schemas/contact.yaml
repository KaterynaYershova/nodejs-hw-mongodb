type: object
properties:
  id:
    type: string
    example: "5f8f8c44b54764421b7156c9"
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    example: "johndoe@example.com"
  phone:
    type: string
    example: "+1234567890"
  photo:
    type: string
    format: binary
    description: "Photo of the contact"
required:
  - name
  - email
  - phone
