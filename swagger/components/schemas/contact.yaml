type: object
properties:
  name:
    type: string
    example: "John Doe"
  phoneNumber:
    type: string
    example: "+1234567890"
  email:
    type: string
    example: "johndoe@example.com"
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: ['work', 'home', 'personal', 'other']
    example: 'personal'
  photo:
    type: string
    format: binary
    description: "Photo of the contact"
required:
  - name
  - phoneNumber
  - contactType
