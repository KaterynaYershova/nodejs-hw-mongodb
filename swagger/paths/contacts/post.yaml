tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Endpoint for creating a new contact with an optional photo.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
        properties:
          name:
            type: string
            description: "Name of the contact"
            example: "John Doe"
          email:
            type: string
            description: "Email address of the contact"
            example: "john.doe@example.com"
          phone:
            type: string
            description: "Phone number of the contact"
            example: "+1234567890"
          address:
            type: string
            description: "Contact's address"
            example: "123 Main St, Springfield"
          photo:
            type: string
            format: binary
            description: "Photo of the contact"
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully created a contact!"
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: "Invalid input data"
  '401':
    $ref: '../../components/responses/401.yaml'
