tags:
  - Contacts
summary: Get contact by ID
operationId: getContact
description: Retrieve a contact by their unique ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
        '200':
          description: Contact found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Successfully found contact"
                  data:
                    $ref: '../../../components/schemas/contact.yaml'
        '401':
          $ref: '../../../components/responses/401.yaml'
        '404':
          $ref: '../../../components/responses/404.yaml'      
